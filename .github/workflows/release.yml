name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prepared release tag, for example v0.1.1'
        required: true
        type: string
      dry_run:
        description: 'Validate the draft without publishing'
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'nickalexej/valheim-newtcrafthub-plant-removal-fix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 -m maintenance.release --tag "$RELEASE_TAG" --dry-run
          else
            python3 -m maintenance.release --tag "$RELEASE_TAG"
          fi
