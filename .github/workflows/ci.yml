name: Maintenance CI
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m maintenance.generate --check
      - run: python3 -m unittest discover -s tests -v
      - name: Check plugin release decision
        run: python3 -m maintenance.release_policy --ref HEAD --enforce
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: git diff --exit-code
